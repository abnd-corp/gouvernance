# Workflow partagé : tous les projets l'appellent (R22).
# R5 : titre de PR en Conventional Commits.
# R16 : aucune signature d'IA dans les commits, le titre et la description.
name: Contrôle des PR

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  titre:
    name: Titre en Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier le titre
        env:
          TITRE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITRE" | grep -Eq '^(feat|fix|chore|docs|refactor|test|ci|build|perf|style|revert)(\([a-z0-9._-]+\))?!?: .+'; then
            echo "::error::Le titre doit commencer par feat:, fix:, chore:, docs:… (R5). Titre reçu : $TITRE"
            exit 1
          fi

  signatures:
    name: Aucune signature d'IA
    runs-on: ubuntu-latest
    steps:
      - name: Chercher co-auteur ou mention d'outil
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
          NUMERO: ${{ github.event.pull_request.number }}
          TITRE: ${{ github.event.pull_request.title }}
          CORPS: ${{ github.event.pull_request.body }}
        run: |
          motif='co-authored-by|generated with|generated by claude|🤖'
          if printf '%s\n%s\n' "$TITRE" "$CORPS" | grep -Eiq "$motif"; then
            echo "::error::Signature d'IA dans le titre ou la description de la PR (R16)."
            exit 1
          fi
          if gh api --paginate "repos/$DEPOT/pulls/$NUMERO/commits" --jq '.[].commit.message' | grep -Eiq "$motif"; then
            echo "::error::Signature d'IA dans un message de commit (R16)."
            exit 1
          fi
