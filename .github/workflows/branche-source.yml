# Workflow partagé : le chemin feature/** → dev → staging → main (R45).
# Repris du contrôle d'Abatelier. Le projet l'appelle sur les PR vers dev, staging et main.
name: Branche source

on:
  workflow_call:

permissions:
  contents: read

jobs:
  source:
    name: Branche source autorisée
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier la branche source
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          case "$BASE" in
            # Dependabot ouvre aussi ses PR de mises à jour vers dev
            dev)     allowed='feature/* ou dependabot/*'; ok=false; case "$HEAD" in feature/* | dependabot/*) ok=true ;; esac ;;
            staging) allowed='dev';       ok=false; [ "$HEAD" = dev ] && ok=true ;;
            main)    allowed='staging';   ok=false; [ "$HEAD" = staging ] && ok=true ;;
            *)       allowed='-';         ok=true ;;
          esac
          if [ "$ok" != true ]; then
            echo "::error::« $HEAD » ne peut pas être mergée dans « $BASE ». Seule « $allowed » est acceptée (feature/** → dev → staging → main)."
            exit 1
          fi
          echo "✓ $HEAD → $BASE autorisé"

      # Une promotion ne doit rien apporter qui ne soit pas déjà passé par l'étape précédente
      - name: Récupérer l'historique
        if: github.base_ref == 'staging' || github.base_ref == 'main'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Comparer avec la branche cible
        if: github.base_ref == 'staging' || github.base_ref == 'main'
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if ! git merge-base --is-ancestor "origin/$BASE" "origin/$HEAD" && \
             [ -n "$(git log --no-merges --format=%H "origin/$HEAD..origin/$BASE")" ]; then
            echo "::error::« $BASE » contient des commits absents de « $HEAD ». Quelqu'un a modifié « $BASE » sans passer par « $HEAD » : il faut d'abord les ramener dans dev."
            git log --no-merges --oneline "origin/$HEAD..origin/$BASE"
            exit 1
          fi
          echo "✓ $HEAD contient tout le travail de $BASE"
