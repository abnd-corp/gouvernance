# Workflow partagé : promeut les images sans les reconstruire (R44).
# On retrouve les images construites sur dev (images-dev.yml) par l'empreinte du contenu de chaque service, et on leur
# pose le tag de l'étape. Le manifeste suit le même chemin. Si un contenu n'est jamais passé par dev, il n'a pas
# d'image : la promotion échoue au lieu de reconstruire. Aucun tag « latest ».
#   push sur staging  → tag staging
#   push sur main     → tag prod
#   tag vX.Y.Z        → tag de version et release GitHub avec le manifeste. Le tag doit être sur main (donc en production).
#
# Exemple d'appel :
#   on:
#     push:
#       branches: [staging, main]
#       tags: ["v[0-9]+.[0-9]+.[0-9]+"]
#   jobs:
#     promotion:
#       permissions: { contents: write, packages: write }
#       uses: abnd-corp/gouvernance/.github/workflows/promouvoir-images.yml@<empreinte>
#       with: { gouvernance: <la même empreinte> }
name: Promouvoir les images

on:
  workflow_call:
    inputs:
      gouvernance:
        description: "Empreinte du commit de gouvernance, la même que dans « uses: » (c'est elle qui fournit scripts/images.sh)"
        type: string
        required: true
      configuration:
        description: "Chemin de la description des services, relatif au projet"
        type: string
        default: ".github/images/services.json"

permissions:
  contents: write
  packages: write

env:
  IMAGES_CONF: ${{ inputs.configuration }}

concurrency:
  group: promotion-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promouvoir:
    name: Promotion ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: abnd-corp/gouvernance
          ref: ${{ inputs.gouvernance }}
          path: .gouvernance
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128 # v2.0.4

      - name: Tag de l'étape
        id: etape
        run: |
          case "$GITHUB_REF" in
            refs/heads/staging) echo "tags=staging" >> "$GITHUB_OUTPUT" ;;
            refs/heads/main) echo "tags=prod" >> "$GITHUB_OUTPUT" ;;
            refs/tags/v*)
              if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                echo "::error::$GITHUB_REF_NAME n'est pas sur main : une version se pose sur ce qui est en production."
                exit 1
              fi
              echo "tags=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Rien à promouvoir pour $GITHUB_REF : staging, main ou un tag vX.Y.Z."
              exit 1 ;;
          esac

      - run: .gouvernance/scripts/images.sh manifeste "$GITHUB_SHA" "$RUNNER_TEMP/manifeste.json"
      - run: .gouvernance/scripts/images.sh etiqueter "$RUNNER_TEMP/manifeste.json" ${{ steps.etape.outputs.tags }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifeste
          path: ${{ runner.temp }}/manifeste.json
          if-no-files-found: ignore

      - name: Release GitHub
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # sans image (pas de services.json), la release n'a pas de manifeste
          joint=()
          [ -f "$RUNNER_TEMP/manifeste.json" ] && joint=("$RUNNER_TEMP/manifeste.json")
          gh release create "$GITHUB_REF_NAME" "${joint[@]}" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
