# Workflow partagé : construit une image et la publie sur GHCR (R44).
# À appeler sur un push sur main, c'est-à-dire au merge de staging dans main : une image par mise en production.
# Tag : l'empreinte du commit, plus X.Y.Z et X.Y si le commit porte un tag vX.Y.Z. Aucun tag « latest ». Images privées.
#
# Exemple d'appel :
#   jobs:
#     api:
#       permissions: { contents: read, packages: write }
#       uses: abnd-corp/gouvernance/.github/workflows/publier-image.yml@<empreinte>
#       with: { nom: abatelier-api, contexte: ./api, cible: prod }
name: Publier une image

on:
  workflow_call:
    inputs:
      nom:
        description: "Nom de l'image sous ghcr.io/abnd-corp/ (ex. abatelier-api)"
        type: string
        required: true
      contexte:
        description: "Dossier de construction"
        type: string
        default: "."
      dockerfile:
        description: "Chemin du Dockerfile, relatif au dépôt"
        type: string
        default: ""
      cible:
        description: "Étape (target) du Dockerfile à construire"
        type: string
        default: ""
      plateformes:
        description: "Architectures"
        type: string
        default: "linux/amd64,linux/arm64"
      publier:
        description: "false : construit sans publier (essai)"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Image ${{ inputs.nom }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Version du commit, s'il en porte une
        id: version
        run: |
          v=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          echo "v=${v#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Connexion à GHCR
        if: inputs.publier
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Tags et étiquettes
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.nom }}
          flavor: latest=false
          tags: |
            type=sha,format=long,prefix=
            type=semver,pattern={{version}},value=${{ steps.version.outputs.v }},enable=${{ steps.version.outputs.v != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.v }},enable=${{ steps.version.outputs.v != '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Construire et publier
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.contexte }}
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.cible }}
          platforms: ${{ inputs.plateformes }}
          push: ${{ inputs.publier }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.nom }}
          cache-to: type=gha,mode=max,scope=${{ inputs.nom }}
